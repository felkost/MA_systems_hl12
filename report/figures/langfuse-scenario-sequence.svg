<svg viewBox="0 0 1160 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s2a-title s2a-desc">
    <title id="s2a-title">Trace context sequence for one REPL turn</title>
    <desc id="s2a-desc">main.py enters run_context to propagate session and user attributes and attach run_id baggage, then opens the repl.question root span; sub-agents and tools inherit the propagated attributes via RunContextStampingProcessor; the answer returns and set_trace_io stamps trace input/output on the root span; the span then exports synchronously to the offline JSON dump and, when tracing is enabled, in a batch to Langfuse Cloud.</desc>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <defs>
      <marker id="s2a-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#6f7690"/>
      </marker>
    </defs>

    <g font-family="Arial,sans-serif">
      <rect x="30" y="20" width="140" height="36" rx="5" fill="#ffffff" stroke="#4c526d"/>
      <text x="100" y="42" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">main.py</text>
      <rect x="220" y="20" width="140" height="36" rx="5" fill="#ffffff" stroke="#4c526d"/>
      <text x="290" y="42" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">run_context</text>
      <rect x="390" y="20" width="200" height="36" rx="5" fill="#ffffff" stroke="#4c526d"/>
      <text x="490" y="42" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">repl.question span</text>
      <rect x="610" y="20" width="180" height="36" rx="5" fill="#ffffff" stroke="#4c526d"/>
      <text x="700" y="42" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">sub-agents / tools</text>
      <rect x="810" y="20" width="180" height="36" rx="5" fill="#ffffff" stroke="#4c526d"/>
      <text x="900" y="42" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">SpanJsonExporter</text>
      <rect x="1000" y="20" width="120" height="36" rx="5" fill="#ffffff" stroke="#4c526d"/>
      <text x="1060" y="42" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle">Langfuse Cloud</text>
    </g>

    <g stroke="#c7cad6" stroke-width="1">
      <line x1="100" y1="56" x2="100" y2="430"/>
      <line x1="290" y1="56" x2="290" y2="430"/>
      <line x1="490" y1="56" x2="490" y2="430"/>
      <line x1="700" y1="56" x2="700" y2="430"/>
      <line x1="900" y1="56" x2="900" y2="430"/>
      <line x1="1060" y1="56" x2="1060" y2="430"/>
    </g>

    <g font-family="Arial,sans-serif" font-size="11" fill="#4c526d">
      <path d="M 100,84 H 290" stroke="#6f7690" stroke-width="1.2" marker-end="url(#s2a-arrow)"/>
      <text x="108" y="78">run_context(session_id, user_id, run_id)</text>
    </g>

    <rect x="300" y="98" width="170" height="22" rx="3" fill="rgba(231,217,208,0.7)" stroke="#9296a8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="385" y="112" fill="#4c526d" font-size="10" font-family="Arial,sans-serif" text-anchor="middle">propagate_attributes(session_id,</text>
    <text x="385" y="124" fill="#4c526d" font-size="10" font-family="Arial,sans-serif" text-anchor="middle">user_id) + baggage.set(run_id)</text>

    <g font-family="Arial,sans-serif" font-size="11" fill="#4c526d">
      <path d="M 100,150 H 490" stroke="#6f7690" stroke-width="1.2" marker-end="url(#s2a-arrow)"/>
      <text x="108" y="144">start_as_current_span("repl.question", run_id)</text>

      <path d="M 490,196 H 700" stroke="#6f7690" stroke-width="1.2" marker-end="url(#s2a-arrow)"/>
      <text x="498" y="190">_drive_turn(graph, payload)</text>
    </g>

    <rect x="620" y="214" width="360" height="34" rx="3" fill="rgba(203,208,164,0.28)" stroke="#9296a8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="800" y="227" fill="#4c526d" font-size="10" font-family="Arial,sans-serif" text-anchor="middle">RunContextStampingProcessor.on_start copies</text>
    <text x="800" y="239" fill="#4c526d" font-size="10" font-family="Arial,sans-serif" text-anchor="middle">session.id/user.id/run_id onto every span here</text>

    <g font-family="Arial,sans-serif" font-size="11" fill="#4c526d">
      <path d="M 700,264 H 490" stroke="#6f7690" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#s2a-arrow)"/>
      <text x="498" y="258">answer text</text>
    </g>

    <rect x="500" y="280" width="190" height="18" rx="3" fill="rgba(231,217,208,0.7)" stroke="#9296a8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="595" y="293" fill="#4c526d" font-size="10" font-family="Arial,sans-serif" text-anchor="middle">set_trace_io(input=question, output=answer)</text>

    <g font-family="Arial,sans-serif" font-size="11" fill="#4c526d">
      <path d="M 490,330 H 900" stroke="#6f7690" stroke-width="1.2" marker-end="url(#s2a-arrow)"/>
      <text x="498" y="324">on span end (every span, synchronous)</text>
    </g>

    <rect x="810" y="346" width="180" height="18" rx="3" fill="rgba(231,217,208,0.7)" stroke="#9296a8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="900" y="359" fill="#4c526d" font-size="10" font-family="Arial,sans-serif" text-anchor="middle">write runs/&lt;run_id&gt;/spans.json</text>

    <g font-family="Arial,sans-serif" font-size="11" fill="#4c526d">
      <path d="M 490,396 H 1060" stroke="#6f7690" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#s2a-arrow)"/>
      <text x="498" y="390">on span end (batched, only if tracing_enabled)</text>
    </g>
  </svg>
